name: docshot

services:
  docshot:
    # Gotenberg + docshot in one container; network isolation uses Gotenberg's --*-deny-*-ips flags (see Dockerfile CMD).
    build:
      context: .
      args:
        # make up stamps VERSION; a plain docker compose build stamps dev.
        VERSION: ${DOCSHOT_VERSION:-dev}
        GOTENBERG_VERSION: "8.37"
    image: docshot:${DOCSHOT_VERSION:-dev}
    container_name: docshot
    restart: unless-stopped
    ports:
      - "9994:3000"
    environment:
      - DOCSHOT_DEFAULT_DPI=${DOCSHOT_DEFAULT_DPI:-150}
      - DOCSHOT_DEFAULT_WIDTH=${DOCSHOT_DEFAULT_WIDTH:-0}
      - DOCSHOT_DEFAULT_HEIGHT=${DOCSHOT_DEFAULT_HEIGHT:-0}
      - DOCSHOT_MAX_SIDE=${DOCSHOT_MAX_SIDE:-10000}
      - DOCSHOT_MAX_PIXELS=${DOCSHOT_MAX_PIXELS:-40000000}
      - DOCSHOT_MAX_BYTES=${DOCSHOT_MAX_BYTES:-100MB}
      - DOCSHOT_TIMEOUT_SECONDS=${DOCSHOT_TIMEOUT_SECONDS:-180}
      - DOCSHOT_PDFIUM_WORKERS=${DOCSHOT_PDFIUM_WORKERS:-4}
      - DOCSHOT_CACHE_MB=${DOCSHOT_CACHE_MB:-256}
      - DOCSHOT_MAX_AGE=${DOCSHOT_MAX_AGE:-3600}
      # Disk cache of rendered results, keyed by URL: a hit costs no S3/file access. See README → Caching.
      - DOCSHOT_CACHE_DIR=${DOCSHOT_CACHE_DIR:-/tmp/docshot}
      - DOCSHOT_CACHE_SIZE=${DOCSHOT_CACHE_SIZE:-10GB}
      - DOCSHOT_CACHE_TTL=${DOCSHOT_CACHE_TTL:-0}
      - DOCSHOT_CACHE_STALE=${DOCSHOT_CACHE_STALE:-true}
      - DOCSHOT_CACHE_BUSTER=${DOCSHOT_CACHE_BUSTER:-}
      - DOCSHOT_CACHE_TAGS=${DOCSHOT_CACHE_TAGS:-false}
      - DOCSHOT_CDN_MAX_AGE=${DOCSHOT_CDN_MAX_AGE:-0}
      # GET /render sources for <img src=…> previews — all off unless set.
      # ?s3=bucket/key as a source, and ?store=s3[:append|replace|suffix|hash]
      # to keep results in S3 (next to an S3 source; else in DOCSHOT_STORE_BUCKET).
      - DOCSHOT_S3_ENDPOINT=${DOCSHOT_S3_ENDPOINT:-}
      - DOCSHOT_S3_ACCESS_KEY=${DOCSHOT_S3_ACCESS_KEY:-}
      - DOCSHOT_S3_SECRET_KEY=${DOCSHOT_S3_SECRET_KEY:-}
      - DOCSHOT_S3_REGION=${DOCSHOT_S3_REGION:-}
      - DOCSHOT_S3_SSL=${DOCSHOT_S3_SSL:-true}
      - DOCSHOT_S3_BUCKETS=${DOCSHOT_S3_BUCKETS:-}
      - DOCSHOT_STORE_BUCKET=${DOCSHOT_STORE_BUCKET:-}
      - DOCSHOT_STORE_PREFIX=${DOCSHOT_STORE_PREFIX:-docshot/}
      - DOCSHOT_STORE_STRATEGY=${DOCSHOT_STORE_STRATEGY:-append}
      # ?url= : regexp of URLs allowed to be fetched (SSRF guard). Empty = off.
      - DOCSHOT_FETCH_ALLOW=${DOCSHOT_FETCH_ALLOW:-}
      - TZ=${TZ:-UTC}
    volumes:
      - docshot-cache:/tmp/docshot      # disk cache survives restarts and upgrades
    deploy:
      resources:
        limits:
          cpus: "${DOCSHOT_CPUS:-4.0}"
          memory: ${DOCSHOT_MEMORY:-4g}

volumes:
  docshot-cache:
