name: Docker

on:
  workflow_dispatch:

  push:
    branches: [master]

  pull_request:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: VERSION format
        run: grep -Eqx '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' VERSION || { echo "::error file=VERSION::expected YYYY.MM.DD or YYYY.MM.DD.N, got '$(cat VERSION)'"; exit 1; }

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet -tags nodynamic ./...

      - name: go test
        run: go test -tags nodynamic -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          install-go: false
          build-tags: nodynamic
          # v0.8.1 (latest release) can't read go1.27.2 export data; pinned to
          # a master commit verified against go1.27.2 (same as dockette/viewdoc).
          version: "452d5bb86b45"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags nodynamic ./...

      - name: shellcheck
        run: shellcheck -S warning docshot.sh test/formats/gen.sh

      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile

  smoke:
    name: Smoke test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: dockette/docshot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render a page
        run: make smoke DOCKER_IMAGE=dockette/docshot:test

      - name: Check HTML isolation
        run: make test-isolation DOCKER_IMAGE=dockette/docshot:test

      # Informational: the base image (LibreOffice, Chromium) carries CVEs we cannot fix here;
      # the weekly rebuild picks up upstream fixes. Pinned by digest: scanners are a supply-chain target too.
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress dockette/docshot:test

  docker:
    name: Docker (dockette/docshot)
    needs: smoke
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # dockette/docshot:latest        rolling, latest master
      # dockette/docshot:<VERSION>     release (YYYY.MM.DD); like other dockette
      #                                versions it's rebuilt by the weekly schedule
      # dockette/docshot:sha-<sha>     immutable, for rollbacks / pinning
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: dockette/docshot
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      # Verify with: cosign verify dockette/docshot:<tag> --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   --certificate-identity-regexp '^https://github.com/dockette/docshot/'
      - name: Sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "dockette/docshot@${DIGEST}"

  # Tags the commit and publishes a GitHub release for VERSION the first
  # time it reaches master with the image pushed (make release bumps it).
  release:
    name: Release
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists"
            exit 0
          fi
          # The CHANGELOG.md section of this version, then GitHub's generated list of changes.
          awk -v h="## $v" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md --generate-notes

  docs:
    name: Docs
    needs: docker
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/docshot"
