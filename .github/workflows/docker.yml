name: Docker

on:
  workflow_dispatch:

  push:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet -tags nodynamic ./...

      - name: go test
        run: go test -tags nodynamic -race ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
          build-tags: nodynamic
          # v0.8.1 (latest release) can't read go1.27.2 export data; pinned to
          # a master commit verified against go1.27.2 (same as dockette/viewdoc).
          version: "452d5bb86b45"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags nodynamic ./...

      - name: shellcheck
        run: shellcheck -S warning docshot.sh test/formats/gen.sh

      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read VERSION
        id: version
        run: . ./VERSION && echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockette/docshot:test
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: make smoke test-isolation DOCKER_IMAGE=dockette/docshot:test

      - name: Login to DockerHub
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build, two tags: latest and <date>
      - name: Build and push
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            dockette/docshot:latest
            dockette/docshot:${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./VERSION
          gh release view "$VERSION" || gh release create "$VERSION" --generate-notes

  docs:
    name: Docs
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/docshot"
